name: Refresh prep week tracker

on:
  schedule:
    # A backstop, not the main driver.
    #
    # GitHub gives scheduled workflows on free public repos the lowest priority
    # in the queue and drops most of them. Measured on this repo, a single
    # hourly entry delivered about one run every five and a half hours, and six
    # entries an hour delivered none at all in the two hours after they were
    # added. There is nothing in here that can fix that.
    #
    # So the ten minute cadence comes from an external scheduler calling the
    # dispatch API instead, and this hourly entry only exists to cover the case
    # where that scheduler is down. One an hour, because every firing costs a
    # 62KB request to a free community API and there is no point paying it twice.
    - cron: '7 * * * *'
  workflow_dispatch:        # the Run workflow button, for a refresh on demand
  push:
    branches: [main]

permissions:
  contents: write           # to commit the refreshed meta.json snapshot
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- build
  build:
    runs-on: ubuntu-latest
    # when the source is down there is nothing to publish, so the rest of the
    # run stands down quietly and the last good page stays up
    outputs:
      skip: ${{ steps.pull.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pull the latest scores
        id: pull
        env:
          HOME_KID: '826'
          LO: '588'
          HI: '1086'
          # read to see whether the source has moved since the last build; if it
          # has not, the run stops here and nothing else is requested
          PAGE_URL: 'https://demoncks.github.io/KVKPrepTracker/index.html'
          # how stale the cached active player counts may get before the 381KB
          # kingdom feed is pulled again
          META_MAX_AGE_H: '6'
        run: node pull.mjs

      - name: Build the page
        if: steps.pull.outputs.skip != '1'
        run: python3 build.py

      # meta.json is a convenience cache of active player counts, used only as a
      # fallback when the kingdom feed refuses us. Failing to save it is a minor
      # inconvenience. Failing to publish the page is not, and until now a
      # rejected push took the deploy down with it: run #835 on 2 Nov 2026 died
      # here because a second commit landed on main while it was building, so
      # its push was no longer a fast forward. Rebase onto whatever is there
      # now, retry a couple of times, and never fail the run over it.
      - name: Keep the active player snapshot current
        if: steps.pull.outputs.skip != '1'
        continue-on-error: true
        run: |
          if git diff --quiet -- meta.json; then
            echo 'meta.json unchanged, nothing to save'
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add meta.json
          git commit -m 'refresh active player snapshot'
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "$GITHUB_REF_NAME" \
               && git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "snapshot saved on attempt $attempt"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo '::warning::could not save meta.json, the page is published anyway'

      - name: Collect the site
        if: steps.pull.outputs.skip != '1'
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          if [ -d snapshots ]; then cp -r snapshots _site/snapshots; fi

      - uses: actions/upload-pages-artifact@v3
        if: steps.pull.outputs.skip != '1'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.skip != '1'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
