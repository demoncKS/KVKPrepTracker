name: Refresh prep week tracker

on:
  schedule:
    # every hour on the hour, UTC. GitHub runs scheduled jobs on a best effort
    # basis and can be ten to forty minutes late when the queue is busy, so the
    # page stamps the source's own snapshot time rather than the build time.
    - cron: '0 * * * *'
  workflow_dispatch:        # the Run workflow button, for a refresh on demand
  push:
    branches: [main]

permissions:
  contents: write           # to commit the refreshed meta.json snapshot
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # when the source is down there is nothing to publish, so the rest of the
    # run stands down quietly and the last good page stays up
    outputs:
      skip: ${{ steps.pull.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pull the latest scores
        id: pull
        env:
          HOME_KID: '826'
          LO: '750'
          HI: '900'
        run: node pull.mjs

      - name: Build the page
        if: steps.pull.outputs.skip != '1'
        run: python3 build.py

      - name: Keep the active player snapshot current
        if: steps.pull.outputs.skip != '1'
        run: |
          if ! git diff --quiet -- meta.json; then
            git config user.name  'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add meta.json
            git commit -m 'refresh active player snapshot'
            git push
          fi

      - name: Collect the site
        if: steps.pull.outputs.skip != '1'
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          if [ -d snapshots ]; then cp -r snapshots _site/snapshots; fi

      - uses: actions/upload-pages-artifact@v3
        if: steps.pull.outputs.skip != '1'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.skip != '1'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
